version: "0.1"
status: draft-normative-candidate
profile: avp-scenario-v0.1
requirements:
  - id: AVP-SCENARIO-001
    level: MUST
    area: materialization
    statement: ScenarioTemplate and ScenarioInstance execution contracts are distinguished.
    spec: spec/scenario/scenario-contract.md
    anchor: avp-scenario-001
  - id: AVP-SCENARIO-002
    level: MUST
    area: determinism
    statement: Equivalent declared compilation inputs produce equivalent ScenarioInstance identity.
    spec: spec/scenario/scenario-contract.md
    anchor: avp-scenario-002
  - id: AVP-SCENARIO-003
    level: MUST
    area: materialization
    statement: Unresolved required execution inputs fail closed before Episode execution.
    spec: spec/scenario/scenario-contract.md
    anchor: avp-scenario-003
  - id: AVP-SCENARIO-004
    level: MUST
    area: identity
    statement: ScenarioInstance exposes stable identity bound to execution-relevant materialized content.
    spec: spec/scenario/scenario-contract.md
    anchor: avp-scenario-004
  - id: AVP-SCENARIO-005
    level: MUST
    area: immutability
    statement: Materialized ScenarioInstance semantics do not change during Episode execution.
    spec: spec/scenario/scenario-contract.md
    anchor: avp-scenario-005
  - id: AVP-SCENARIO-006
    level: MUST
    area: visibility
    statement: Subject projection excludes evaluator-only material unless explicitly observable.
    spec: spec/scenario/scenario-contract.md
    anchor: avp-scenario-006
  - id: AVP-SCENARIO-007
    level: MUST
    area: capability
    statement: Subject capability exposure derives from the materialized actor capability projection.
    spec: spec/scenario/scenario-contract.md
    anchor: avp-scenario-007
  - id: AVP-SCENARIO-008
    level: MUST
    area: references
    statement: Execution-relevant external references are bound to profile-appropriate resolved identity.
    spec: spec/scenario/scenario-contract.md
    anchor: avp-scenario-008
  - id: AVP-SCENARIO-009
    level: MUST
    area: failure-separation
    statement: Scenario validation or compilation failure is not Agent task failure.
    spec: spec/scenario/scenario-contract.md
    anchor: avp-scenario-009
