version: "0.1"
status: draft-normative-candidate
requirements:
  - id: AVP-CORE-001
    level: MUST
    area: episode.lifecycle
    statement: An Episode MUST have exactly one lifecycle state at any point in time.
    spec: spec/core/episode-lifecycle.md
    conformance: TCK-LIFECYCLE-001
  - id: AVP-CORE-002
    level: MUST
    area: episode.lifecycle
    statement: Lifecycle transitions MUST be deterministic and observable.
    spec: spec/core/episode-lifecycle.md
    conformance: TCK-LIFECYCLE-002
  - id: AVP-CORE-003
    level: MUST
    area: episode.identity
    statement: An Episode MUST have a stable identifier within its verification scope.
    spec: spec/core/episode-lifecycle.md
    conformance: TCK-LIFECYCLE-003
  - id: AVP-CORE-004
    level: MUST
    area: episode.transition
    statement: A lifecycle transition MUST record previous and resulting states.
    spec: spec/core/episode-lifecycle.md
    conformance: TCK-LIFECYCLE-004
  - id: AVP-CORE-005
    level: MUST_NOT
    area: episode.termination
    statement: A terminal Episode MUST NOT transition back into an executable lifecycle state.
    spec: spec/core/episode-lifecycle.md
    conformance: TCK-LIFECYCLE-005
  - id: AVP-CORE-006
    level: MUST
    area: episode.failure
    statement: Implementations MUST distinguish execution outcome from verification validity.
    spec: spec/core/episode-lifecycle.md
    conformance: TCK-LIFECYCLE-006
  - id: AVP-CORE-007
    level: MUST
    area: episode.reproducibility
    statement: Replayed Episodes MUST preserve reference identity metadata.
    spec: spec/core/episode-lifecycle.md
    conformance: TCK-LIFECYCLE-007
