[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "avp-reference"
dynamic = ["version"]
description = "Reference implementation for the proposed Agent Verification Protocol"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "PyYAML>=6.0,<7",
  "jsonschema>=4.22,<5",
  "rfc8785>=0.1.4,<0.2",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
]
http = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
]
otel = [
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
]
conformance = [
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
]

[project.urls]
Homepage = "https://github.com/lilinling12/agent-verification-protocol"
Repository = "https://github.com/lilinling12/agent-verification-protocol"
Issues = "https://github.com/lilinling12/agent-verification-protocol/issues"

[project.scripts]
avp = "avp_ref.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"avp_ref.resources" = ["*.json"]

[tool.setuptools.dynamic]
version = {attr = "avp_ref._version.__version__"}
