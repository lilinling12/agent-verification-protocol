[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avp-reference"
version = "0.1.0"
description = "Reference implementation for the proposed Agent Verification Protocol"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}

[project.optional-dependencies]
dev = ["PyYAML>=6.0", "jsonschema>=4.22"]
http = ["fastapi>=0.115", "uvicorn>=0.32"]
yaml = ["PyYAML>=6.0"]
otel = ["opentelemetry-api>=1.30", "opentelemetry-sdk>=1.30"]

[project.scripts]
avp = "avp_ref.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
