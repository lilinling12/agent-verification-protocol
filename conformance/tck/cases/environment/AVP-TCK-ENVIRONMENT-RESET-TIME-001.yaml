  domain: environment
  status: draft
profile: avp-environment-v0.1
requirements: [AVP-ENVIRONMENT-003, AVP-ENVIRONMENT-004]
applicability: mandatory
type: positive
vector:
  resetTarget: INITIAL
  mutation:
