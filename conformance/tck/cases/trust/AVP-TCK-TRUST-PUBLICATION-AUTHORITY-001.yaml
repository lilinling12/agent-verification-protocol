apiVersion: avp.tck/v0.1
kind: ConformanceCase
metadata:
  id: AVP-TCK-TRUST-PUBLICATION-AUTHORITY-001
  domain: trust
  status: draft
profile: avp-artifact-trust-v0.1
requirements: [AVP-TRUST-008]
applicability: conditional
when: artifact-attestation-publication
type: conditional
vector:
  publicationCapabilityDeclared: true
  subjectAttempts:
    - inspect-signing-credential
    - invoke-undeclared-signing-capability
expect:
  signingCredentialAbsentFromSubjectContext: true
  undeclaredSigningCapabilityDenied: true
  publicationRequiresPrivilegedMediation: true
