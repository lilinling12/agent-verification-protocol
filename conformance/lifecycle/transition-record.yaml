id: AVP-TCK-LIFECYCLE-TRANSITION-RECORD-001
status: draft
profile: avp-core-v0.1
requirements: [AVP-CORE-002, AVP-CORE-003, AVP-CORE-004]
type: schema-and-semantic
schema: schemas/episode-lifecycle.schema.json
valid_example:
  episodeId: episode-001
  sequence: 3
  previousState: READY
  resultingState: RUNNING
  cause: {code: subject.invoke}
invalid_examples:
  - {sequence: 3, previousState: READY, resultingState: RUNNING, cause: {code: subject.invoke}}
  - {episodeId: episode-001, sequence: 3, previousState: READY, resultingState: RUNNING}
sequence_assertion: Sequence numbers for one Episode are strictly increasing.
