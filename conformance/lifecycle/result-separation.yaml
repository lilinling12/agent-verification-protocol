id: AVP-TCK-LIFECYCLE-RESULT-SEPARATION-001
status: draft
profile: avp-core-v0.1
requirements: [AVP-CORE-006, AVP-CORE-010]
type: semantic
assertions:
  - COMPLETED does not imply TaskVerdict=PASS.
  - ABORTED is not a TaskVerdict.
  - INVALID is not a TaskVerdict.
  - INFRA_FAILED is not a TaskVerdict.
  - Lifecycle state and Validity remain separately representable.
