name: Relational Parity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: relational-parity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  canonical-parity:
    name: >-
      PostgreSQL ${{ matrix.postgresql-version }} / MySQL ${{ matrix.mysql-version }}
      / Canonical Parity / Python 3.13
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - postgresql-version: '17.11'
            postgresql-image: postgres:17.11
            mysql-version: '8.4.11'
            mysql-image: mysql:8.4.11
          - postgresql-version: '18.6'
            postgresql-image: postgres:18.6
            mysql-version: '9.7.2'
            mysql-image: mysql:9.7.2
    services:
      postgres:
        image: ${{ matrix.postgresql-image }}
        env:
          POSTGRES_PASSWORD: avp-parity-${{ github.run_id }}
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      mysql:
        image: ${{ matrix.mysql-image }}
        env:
          MYSQL_ROOT_PASSWORD: avp-parity-${{ github.run_id }}
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pavp-parity-${{ github.run_id }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
    env:
      AVP_POSTGRESQL_DSN: >-
        postgresql://postgres:avp-parity-${{ github.run_id }}@127.0.0.1:5432/postgres
      AVP_MYSQL_DSN: >-
        mysql://root:avp-parity-${{ github.run_id }}@127.0.0.1:3306/mysql
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Install constrained build tooling
        run: python -m pip install -c constraints/ci.txt build==1.5.0
      - name: Build parity-capable wheel
        run: python -m build --wheel --outdir dist-parity
      - name: Install wheel with both relational backend dependencies
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist-parity/*.whl)
          if (( ${#wheels[@]} != 1 )); then
            echo "expected exactly one parity test wheel, found ${#wheels[@]}" >&2
            exit 1
          fi
          python -m venv .parity-venv
          .parity-venv/bin/python -m pip install -c constraints/ci.txt \
            "${wheels[0]}[postgresql,mysql]"
          .parity-venv/bin/python -m pip check
      - name: Verify paired database identities
        run: |
          .parity-venv/bin/python - <<'PY'
          import os
          from urllib.parse import unquote, urlsplit

          import mysql.connector
          import psycopg

          with psycopg.connect(os.environ["AVP_POSTGRESQL_DSN"]) as connection:
              postgresql_reported = connection.execute("SHOW server_version").fetchone()[0]
          postgresql_expected = "${{ matrix.postgresql-version }}"
          if postgresql_reported.split()[0] != postgresql_expected:
              raise SystemExit(
                  f"expected PostgreSQL {postgresql_expected}, observed {postgresql_reported}"
              )

          parsed = urlsplit(os.environ["AVP_MYSQL_DSN"])
          mysql_connection = mysql.connector.connect(
              host=parsed.hostname,
              port=parsed.port or 3306,
              user=unquote(parsed.username or ""),
              password=unquote(parsed.password or ""),
              database=parsed.path.lstrip("/") or "mysql",
          )
          try:
              cursor = mysql_connection.cursor()
              try:
                  cursor.execute("SELECT VERSION()")
                  mysql_reported = cursor.fetchone()[0]
              finally:
                  cursor.close()
          finally:
              mysql_connection.close()
          mysql_expected = "${{ matrix.mysql-version }}"
          if mysql_reported.split("-")[0] != mysql_expected:
              raise SystemExit(f"expected MySQL {mysql_expected}, observed {mysql_reported}")

          print(
              "paired relational servers OK: "
              f"PostgreSQL {postgresql_reported}; MySQL {mysql_reported}"
          )
          PY
      - name: Execute real PostgreSQL/MySQL canonical parity acceptance
        run: >-
          .parity-venv/bin/python -m unittest discover
          -s tests -p 'test_relational_backend_parity.py' -v
