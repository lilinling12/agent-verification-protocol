name: Governance

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: governance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  metadata:
    name: Metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GOVERNANCE_HEAD_REF: ${{ github.head_ref }}
      GOVERNANCE_PR_TITLE: ${{ github.event.pull_request.title }}
      GOVERNANCE_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      GOVERNANCE_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Validate PR metadata
        run: python scripts/validate_governance.py --metadata-only
