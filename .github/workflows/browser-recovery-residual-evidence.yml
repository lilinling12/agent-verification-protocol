name: Browser Recovery Residual Evidence

on:
  pull_request:
    paths:
      - '.github/workflows/browser-recovery-residual-evidence.yml'
      - 'tests/acceptance/browser/recovery_evidence_runner.py'
      - 'tests/acceptance/browser/residual_state_evidence_runner.py'
      - 'tests/acceptance/browser/bind_evidence_source.py'
      - 'docs/design/alpha3-browser-cross-engine-acceptance-evidence.md'
      - 'rfcs/AEP-0011-browser-resource-profile.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-recovery-residual-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  recovery-residual:
    name: Recovery / Residual State — Pre-Acceptance Evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      AVP_EVIDENCE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact evidence head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.AVP_EVIDENCE_SOURCE_SHA }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install pinned evidence transport
        run: python -m pip install 'playwright==1.62.0'

      - name: Install exact Playwright engine builds and OS dependencies
        run: python -m playwright install --with-deps chromium firefox webkit

      - name: Record installed transport engine identities
        run: python -m playwright install --list

      - name: Configure controlled loopback test origins
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '127.0.0.1 a.test sub.a.test b.test' | sudo tee -a /etc/hosts >/dev/null
          getent hosts a.test sub.a.test b.test

      - name: Execute snapshot restore and reset evidence
        run: |
          python tests/acceptance/browser/recovery_evidence_runner.py \
            --output browser-evidence/browser-recovery-evidence.json

      - name: Bind recovery evidence to exact source head
        run: |
          python tests/acceptance/browser/bind_evidence_source.py \
            browser-evidence/browser-recovery-evidence.json \
            --expected-sha "${AVP_EVIDENCE_SOURCE_SHA}"

      - name: Execute residual-state noninterference evidence
        run: |
          python tests/acceptance/browser/residual_state_evidence_runner.py \
            --output browser-evidence/browser-residual-state-evidence.json

      - name: Bind residual evidence to exact source head
        run: |
          python tests/acceptance/browser/bind_evidence_source.py \
            browser-evidence/browser-residual-state-evidence.json \
            --expected-sha "${AVP_EVIDENCE_SOURCE_SHA}"

      - name: Show compact recovery and residual disposition
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for filename in (
              'browser-evidence/browser-recovery-evidence.json',
              'browser-evidence/browser-residual-state-evidence.json',
          ):
              path = Path(filename)
              if not path.exists():
                  continue
              document = json.loads(path.read_text())
              print(path.name, 'source=', document.get('repositorySha'), 'binding=', document.get('sourceBinding'))
              for engine in document.get('engines', []):
                  cases = ', '.join(
                      f"{case['case_id']}={case['status']}" for case in engine.get('cases', [])
                  )
                  print(f"  {engine['engine_family']} {engine['browser_version']}: {cases}")
          PY

      - name: Upload exact-head recovery and residual evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-recovery-residual-evidence-${{ env.AVP_EVIDENCE_SOURCE_SHA }}
          path: |
            browser-evidence/browser-recovery-evidence.json
            browser-evidence/browser-residual-state-evidence.json
          if-no-files-found: warn
          retention-days: 30
