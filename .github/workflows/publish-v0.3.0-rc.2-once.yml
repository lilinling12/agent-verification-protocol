name: Publish authorized AVP v0.3.0-rc.2

on:
  push:
    branches:
      - ci/publish-v0.3.0-rc.2
    paths:
      - .github/workflows/publish-v0.3.0-rc.2-once.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.3.0-rc.2-once.yml
    types: [opened, synchronize, reopened]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publish exact RC2 prerelease
    if: >-
      github.repository == 'lilinling12/agent-verification-protocol' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/ci/publish-v0.3.0-rc.2') ||
       (github.event_name == 'pull_request' && github.head_ref == 'ci/publish-v0.3.0-rc.2' && github.base_ref == 'main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.3.0-rc.2
      VERSION: 0.3.0rc2
      TARGET: 9cfbdb7f72b3418aa960100f33845249db73fbcf
      SOURCE_RUN: '32236927283'
      ARTIFACT_NAME: avp-release-evidence-9cfbdb7f72b3418aa960100f33845249db73fbcf
      RELEASE_TITLE: AVP v0.3.0-rc.2

    steps:
      - name: Checkout exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET }}
          path: release-source
          persist-credentials: false

      - name: Publish validated draft and promote to prerelease
        shell: bash
        run: |
          set -Eeuo pipefail

          mutation_started=0
          release_id=""
          cleanup_on_error() {
            rc=$?
            if (( rc != 0 && mutation_started == 1 )); then
              echo "publication failed after mutation began; cleaning draft release and tag" >&2
              if [[ -n "${release_id}" ]]; then
                gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${release_id}" >/dev/null 2>&1 || true
              else
                mapfile -t cleanup_ids < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
                  --jq ".[] | select(.tag_name == \"${TAG}\" and .draft == true and .target_commitish == \"${TARGET}\" and .name == \"${RELEASE_TITLE}\") | .id" 2>/dev/null || true)
                for id in "${cleanup_ids[@]:-}"; do
                  [[ -n "${id}" ]] && gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}" >/dev/null 2>&1 || true
                done
              fi
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" >/dev/null 2>&1 || true
            fi
            exit "${rc}"
          }
          trap cleanup_on_error EXIT

          echo "Verifying release-source freeze..."
          actual_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "${actual_main}" != "${TARGET}" ]]; then
            echo "main drift: expected ${TARGET}, got ${actual_main}" >&2
            exit 1
          fi
          actual_checkout="$(git -C release-source rev-parse HEAD)"
          if [[ "${actual_checkout}" != "${TARGET}" ]]; then
            echo "exact source checkout drift: expected ${TARGET}, got ${actual_checkout}" >&2
            exit 1
          fi

          echo "Verifying exact-main CI source run..."
          run_event="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN}" --jq '.event')"
          run_branch="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN}" --jq '.head_branch')"
          run_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN}" --jq '.head_sha')"
          run_status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN}" --jq '.status')"
          run_conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN}" --jq '.conclusion')"
          if [[ "${run_event}" != "push" || "${run_branch}" != "main" || "${run_sha}" != "${TARGET}" || "${run_status}" != "completed" || "${run_conclusion}" != "success" ]]; then
            echo "source CI run is not the successful exact-main push gate" >&2
            printf 'event=%s branch=%s sha=%s status=%s conclusion=%s\n' \
              "${run_event}" "${run_branch}" "${run_sha}" "${run_status}" "${run_conclusion}" >&2
            exit 1
          fi

          echo "Reconciling only the draft orphan created by the previous controlled attempt..."
          mapfile -t matching_releases < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"${TAG}\") | [.id, .draft, .prerelease, .target_commitish, .name] | @tsv")
          for row in "${matching_releases[@]:-}"; do
            [[ -z "${row}" ]] && continue
            IFS=$'\t' read -r existing_id existing_draft existing_prerelease existing_target existing_name <<< "${row}"
            if [[ "${existing_draft}" == "true" && "${existing_target}" == "${TARGET}" && "${existing_name}" == "${RELEASE_TITLE}" ]]; then
              echo "deleting exact orphan draft release id=${existing_id} from the previous fail-closed attempt"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${existing_id}" >/dev/null
            else
              echo "release identity ${TAG} already exists in a non-orphan state; refusing to overwrite" >&2
              printf 'id=%s draft=%s prerelease=%s target=%s name=%s\n' \
                "${existing_id}" "${existing_draft}" "${existing_prerelease}" "${existing_target}" "${existing_name}" >&2
              exit 1
            fi
          done

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "tag ${TAG} already exists before this controlled publication attempt; refusing overwrite" >&2
            exit 1
          fi

          echo "Downloading exact-main release evidence from CI run ${SOURCE_RUN}..."
          mkdir -p release-bundle
          gh run download "${SOURCE_RUN}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "${ARTIFACT_NAME}" \
            --dir release-bundle

          echo "Verifying release evidence bytes and identity..."
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('release-bundle')
          expected = {
              'avp_reference-0.3.0rc2-py3-none-any.whl',
              'avp_reference-0.3.0rc2.tar.gz',
              'MANIFEST.json',
              'SHA256SUMS',
          }
          actual = {path.name for path in root.iterdir() if path.is_file()}
          if actual != expected:
              raise SystemExit(f'release asset set mismatch: expected {sorted(expected)}, found {sorted(actual)}')

          manifest = json.loads((root / 'MANIFEST.json').read_text(encoding='utf-8'))
          if manifest.get('schemaVersion') != 'avp-release-evidence/v1':
              raise SystemExit('release manifest schema mismatch')
          if manifest.get('source') != {
              'commit': '9cfbdb7f72b3418aa960100f33845249db73fbcf',
              'repository': 'lilinling12/agent-verification-protocol',
          }:
              raise SystemExit('release manifest source identity mismatch')
          if manifest.get('distribution') != {'name': 'avp-reference', 'version': '0.3.0rc2'}:
              raise SystemExit('release manifest distribution identity mismatch')
          PY
          (
            cd release-bundle
            sha256sum -c SHA256SUMS
          )

          echo "Rendering public release notes without mutating the release source..."
          python - <<'PY'
          from pathlib import Path

          source = Path('release-source/docs/releases/v0.3.0-rc.2.md')
          output = Path('public-release-notes.md')
          text = source.read_text(encoding='utf-8')
          text = text.replace('Status: **SELECTED — NOT PUBLISHED**', 'Status: **PUBLISHED PRERELEASE**', 1)
          old_source = '- Exact release source: established only after the release-selection PR is squash-merged to `main` and the resulting `main` commit passes its push-triggered CI/package/conformance gates'
          new_source = '- Exact release source: `9cfbdb7f72b3418aa960100f33845249db73fbcf`'
          if old_source not in text:
              raise SystemExit('expected pre-publication source-status line not found')
          text = text.replace(old_source, new_source, 1)
          old_boundary = 'Creating `v0.3.0-rc.2`, creating a GitHub prerelease, attaching artifacts, or publishing to any package index requires a separate explicit maintainer authorization after the final squash-merged `main` release commit has passed all required exact-commit gates.'
          new_boundary = 'Publication of `v0.3.0-rc.2` and its GitHub prerelease was explicitly maintainer-authorized after exact-main CI run `32236927283` passed for `9cfbdb7f72b3418aa960100f33845249db73fbcf`. This publication does not authorize PyPI or any other package-index publication.'
          if old_boundary not in text:
              raise SystemExit('expected pre-publication authorization boundary not found')
          text = text.replace(old_boundary, new_boundary, 1)
          output.write_text(text, encoding='utf-8')
          PY

          echo "Creating immutable lightweight tag on the exact release source..."
          mutation_started=1
          gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${TAG}" \
            -f sha="${TARGET}" >/dev/null

          tag_type="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.type')"
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.sha')"
          if [[ "${tag_type}" != "commit" || "${tag_sha}" != "${TARGET}" ]]; then
            echo "new tag does not resolve directly to exact release commit" >&2
            exit 1
          fi

          echo "Creating draft prerelease using the pre-verified tag..."
          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --target "${TARGET}" \
            --title "${RELEASE_TITLE}" \
            --notes-file public-release-notes.md \
            --prerelease \
            --draft \
            release-bundle/avp_reference-0.3.0rc2-py3-none-any.whl \
            release-bundle/avp_reference-0.3.0rc2.tar.gz \
            release-bundle/MANIFEST.json \
            release-bundle/SHA256SUMS >/dev/null

          mapfile -t draft_ids < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"${TAG}\" and .draft == true and .target_commitish == \"${TARGET}\" and .name == \"${RELEASE_TITLE}\") | .id")
          if (( ${#draft_ids[@]} != 1 )); then
            echo "expected exactly one controlled draft release, found ${#draft_ids[@]}" >&2
            exit 1
          fi
          release_id="${draft_ids[0]}"

          echo "Verifying draft release metadata and exact asset set..."
          release_draft="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" --jq '.draft')"
          release_prerelease="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" --jq '.prerelease')"
          release_target="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" --jq '.target_commitish')"
          if [[ "${release_draft}" != "true" || "${release_prerelease}" != "true" || "${release_target}" != "${TARGET}" ]]; then
            echo "draft release identity verification failed" >&2
            exit 1
          fi

          mapfile -t asset_names < <(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" --jq '.assets[].name' | sort)
          expected_assets=(MANIFEST.json SHA256SUMS avp_reference-0.3.0rc2-py3-none-any.whl avp_reference-0.3.0rc2.tar.gz)
          if [[ "${asset_names[*]}" != "${expected_assets[*]}" ]]; then
            echo "draft asset set mismatch" >&2
            printf 'actual: %s\nexpected: %s\n' "${asset_names[*]}" "${expected_assets[*]}" >&2
            exit 1
          fi

          echo "Publishing validated draft as prerelease..."
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            -f draft=false \
            -f prerelease=true >/dev/null

          echo "Verifying public prerelease identity..."
          release_draft="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.draft')"
          release_prerelease="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.prerelease')"
          release_target="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.target_commitish')"
          if [[ "${release_draft}" != "false" || "${release_prerelease}" != "true" || "${release_target}" != "${TARGET}" ]]; then
            echo "public prerelease identity verification failed" >&2
            exit 1
          fi

          mutation_started=0
          trap - EXIT
          echo "published ${TAG} -> ${TARGET} as a GitHub prerelease"
