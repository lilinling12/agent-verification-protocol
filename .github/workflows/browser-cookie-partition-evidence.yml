name: Browser Cookie Partition Evidence

on:
  pull_request:
    paths:
      - '.github/workflows/browser-cookie-partition-evidence.yml'
      - 'tests/acceptance/browser/cookie_partition_evidence_runner.py'
      - 'docs/acceptance/alpha3-browser-cross-engine-evidence-slice-1.md'
      - 'docs/design/alpha3-browser-cross-engine-acceptance-evidence.md'
      - 'rfcs/AEP-0011-browser-resource-profile.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-cookie-partition-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cross-engine-cookie-partition:
    name: SameSite / Temporal / Partition — Pre-Acceptance Evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact evidence head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install pinned evidence transport
        run: python -m pip install 'playwright==1.62.0'

      - name: Install exact Playwright engine builds and OS dependencies
        run: python -m playwright install --with-deps chromium firefox webkit

      - name: Record installed transport engine identities
        run: python -m playwright install --list

      - name: Configure controlled loopback test origins
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            '127.0.0.1 a.test b.test c.test' \
            | sudo tee -a /etc/hosts >/dev/null
          getent hosts a.test b.test c.test

      - name: Execute SameSite, temporal, and partition evidence
        run: |
          python tests/acceptance/browser/cookie_partition_evidence_runner.py \
            --output browser-evidence/browser-cookie-partition-evidence.json

      - name: Show compact evidence disposition
        if: always()
        shell: bash
        run: |
          if [[ -f browser-evidence/browser-cookie-partition-evidence.json ]]; then
            python - <<'PY'
          import json
          from pathlib import Path

          document = json.loads(
              Path('browser-evidence/browser-cookie-partition-evidence.json').read_text()
          )
          for engine in document['engines']:
              cases = ', '.join(
                  f"{case['case_id']}={case['status']}" for case in engine['cases']
              )
              print(f"{engine['engine_family']} {engine['browser_version']}: {cases}")
              for case in engine['cases']:
                  if case['case_id'] == 'BAE-003':
                      print(
                          '  temporal:',
                          case['details'].get('temporal_restore_disposition'),
                      )
                  if case['case_id'] == 'BAE-006':
                      print(
                          '  storage-model:',
                          case['details'].get('observed_storage_model'),
                      )
          PY
          fi

      - name: Upload exact-head cookie/partition evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-cookie-partition-evidence-${{ github.sha }}
          path: browser-evidence/browser-cookie-partition-evidence.json
          if-no-files-found: warn
          retention-days: 30
