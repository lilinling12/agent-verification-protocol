name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality / Python ${{ matrix.python-version }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Install constrained repository environment
        run: python -m pip install -c constraints/ci.txt -e '.[dev]'
      - name: Verify resolved dependency set
        run: python -m pip check
      - name: Quality gate
        run: bash scripts/quality.sh

  package:
    name: Package / Python 3.13
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install constrained build tooling
        run: python -m pip install -c constraints/ci.txt -e '.[dev]'
      - name: Verify build environment
        run: python -m pip check
      - name: Set reproducible build epoch
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct HEAD)" >> "${GITHUB_ENV}"
      - name: Build source and wheel distributions
        run: python -m build
      - name: Canonicalize source distribution gzip metadata
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          sdists=(dist/*.tar.gz)
          if (( ${#sdists[@]} != 1 )); then
            echo "expected exactly one source distribution, found ${#sdists[@]}" >&2
            exit 1
          fi
          python scripts/normalize_sdist.py "${sdists[0]}" --mtime "${SOURCE_DATE_EPOCH}"
      - name: Rebuild distributions for reproducibility
        run: python -m build --outdir dist-repro
      - name: Canonicalize rebuilt source distribution gzip metadata
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          sdists=(dist-repro/*.tar.gz)
          if (( ${#sdists[@]} != 1 )); then
            echo "expected exactly one rebuilt source distribution, found ${#sdists[@]}" >&2
            exit 1
          fi
          python scripts/normalize_sdist.py "${sdists[0]}" --mtime "${SOURCE_DATE_EPOCH}"
      - name: Verify reproducible distribution bytes
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          primary=(dist/*)
          rebuilt=(dist-repro/*)
          if (( ${#primary[@]} != 2 || ${#rebuilt[@]} != 2 )); then
            echo "expected exactly two artifacts in both build directories" >&2
            exit 1
          fi
          for artifact in "${primary[@]}"; do
            peer="dist-repro/$(basename "${artifact}")"
            if [[ ! -f "${peer}" ]]; then
              echo "rebuild missing $(basename "${artifact}")" >&2
              exit 1
            fi
            if ! cmp --silent "${artifact}" "${peer}"; then
              echo "non-reproducible artifact bytes: $(basename "${artifact}")" >&2
              sha256sum "${artifact}" "${peer}" >&2
              exit 1
            fi
          done
      - name: Validate built-wheel metadata
        run: python scripts/validate_release_metadata.py --wheel dist/*.whl
      - name: Install base wheel in an unconstrained clean consumer environment
        run: |
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install dist/*.whl
          .wheel-venv/bin/python -m pip check
      - name: Verify installed-wheel identity
        run: |
          .wheel-venv/bin/python - <<'PY'
          from importlib.metadata import version
          from avp_ref import __version__
          from avp_ref.runtime import ReferenceRuntime

          assert version("avp-reference") == __version__
          assert ReferenceRuntime().capabilities()["implementation"]["version"] == __version__
          print(f"installed-wheel identity OK: avp-reference {__version__}")
          PY
      - name: Installed-wheel reference smoke
        run: .wheel-venv/bin/avp conformance
      - name: Install wheel conformance environment
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          if (( ${#wheels[@]} != 1 )); then
            echo "expected exactly one wheel, found ${#wheels[@]}" >&2
            exit 1
          fi
          python -m venv .conformance-venv
          .conformance-venv/bin/python -m pip install "${wheels[0]}[conformance]"
          .conformance-venv/bin/python -m pip check
      - name: Installed-wheel full TCK conformance
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          profiles=(conformance/tck/profiles/*.yaml)
          if (( ${#profiles[@]} == 0 )); then
            echo "no TCK profiles found" >&2
            exit 1
          fi
          printf 'running %d installed-wheel TCK profiles\n' "${#profiles[@]}"
          for profile_path in "${profiles[@]}"; do
            profile="$(basename "${profile_path}" .yaml)"
            echo "==> ${profile}"
            .conformance-venv/bin/avp tck run \
              --repository-root . \
              --profile "${profile}"
          done
      - name: Build release evidence
        run: |
          python scripts/release_evidence.py build \
            --dist dist \
            --output-dir release-evidence \
            --repository "${GITHUB_REPOSITORY}" \
            --commit "${GITHUB_SHA}"
      - name: Verify release evidence
        run: |
          python scripts/release_evidence.py verify \
            --dist dist \
            --output-dir release-evidence \
            --repository "${GITHUB_REPOSITORY}" \
            --commit "${GITHUB_SHA}"
      - name: Stage release evidence bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-bundle
          cp dist/*.whl dist/*.tar.gz release-evidence/MANIFEST.json release-evidence/SHA256SUMS release-bundle/
      - name: Upload release evidence bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: avp-release-evidence-${{ github.sha }}
          path: release-bundle/
          if-no-files-found: error
          retention-days: 30
