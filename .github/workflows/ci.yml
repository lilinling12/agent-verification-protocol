name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality / Python ${{ matrix.python-version }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Install constrained repository environment
        run: python -m pip install -c constraints/ci.txt -e '.[dev]'
      - name: Verify resolved dependency set
        run: python -m pip check
      - name: Quality gate
        run: bash scripts/quality.sh

  package:
    name: Package / Python 3.13
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install constrained build tooling
        run: python -m pip install -c constraints/ci.txt -e '.[dev]'
      - name: Verify build environment
        run: python -m pip check
      - name: Build source and wheel distributions
        run: python -m build
      - name: Install wheel in an unconstrained clean environment
        run: |
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install dist/*.whl
          .wheel-venv/bin/python -m pip check
      - name: Installed-wheel reference smoke
        run: .wheel-venv/bin/avp conformance
      - name: Installed-wheel TCK smoke
        run: |
          .wheel-venv/bin/avp tck run \
            --repository-root . \
            --case AVP-TCK-LIFECYCLE-NORMAL-001 \
            --case AVP-TCK-LIFECYCLE-PAUSE-001
