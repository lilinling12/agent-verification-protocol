name: AVP Enhancement Proposal
about: Propose a new protocol semantic or extension
title: "[AEP] "
labels: [proposal]
body:
  - type: textarea
    id: problem
    attributes:
      label: Interoperability problem
    validations:
      required: true
  - type: textarea
    id: existing
    attributes:
      label: Why existing standards do not already own this
    validations:
      required: true
  - type: textarea
    id: semantics
    attributes:
      label: Proposed observable semantics
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and evaluator-leakage impact
  - type: textarea
    id: conformance
    attributes:
      label: How can this be conformance-tested?
