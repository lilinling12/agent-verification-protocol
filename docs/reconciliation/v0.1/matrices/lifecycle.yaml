requirement_index: spec/core/requirement-index.yaml
reconciliation:
  decisions:
    - id: LC-001
      subject: lifecycle-authority
      resolution: "Promote observable Episode phase ordering to AVP Core; keep scheduler/worker states non-normative."
      rationale: "Independent implementations need comparable evidence ordering without sharing orchestration internals."
    - id: LC-002
      subject: paused-state
      resolution: "PAUSED is an optional Core state, not a required state."
      rationale: "Pause/resume is useful but not required to verify bounded Agent execution."
    - id: LC-003
      subject: completed-semantics
      resolution: "COMPLETED means lifecycle completion only and never implies PASS."
      rationale: "Lifecycle, task verdict, and validity are independent protocol dimensions."
    - id: LC-004
      subject: invalid-vs-infra-failed
      resolution: "Retain distinct terminal states INVALID and INFRA_FAILED while keeping detailed causes in Validity/failure taxonomy."
      rationale: "Evaluation invalidity and infrastructure inability are materially different and neither alone proves Agent task failure."
semantic_drift:
  - source: src/avp_ref/runtime/state.py
    observation: "Reference implementation currently calls its state-machine module 'Normative' in the module docstring."
    action: "Reference code remains non-normative; remove/adjust this wording in a later implementation-alignment PR after spec promotion."
  - source: historical-design
    observation: "Historical documents mix product execution phases with protocol concepts in places."
    action: "Only observable verification phase semantics are promoted to Core."
conformance_required:
  - AVP-TCK-LIFECYCLE-NORMAL-001
  - AVP-TCK-LIFECYCLE-ILLEGAL-001
  - AVP-TCK-LIFECYCLE-TERMINAL-001
  - AVP-TCK-LIFECYCLE-RESULT-SEPARATION-001
