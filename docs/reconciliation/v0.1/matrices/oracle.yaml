semantic_drift:
  - source: src/avp_ref/models.py
    observation: Runner-specific Oracle failure modes were exposed as top-level Validity values.
    resolution: Collapse them to ORACLE_FAILURE and preserve the specific reason in validityDetail.code.
  - source: src/avp_ref/oracle_runner/models.py
    observation: Reference OraclePackage.identity_digest is derived from a Python package descriptor and could be mistaken for a portable package canonicalization rule.
    resolution: Treat packageDigest as opaque package identity; allow the reference model to bind an externally supplied digest while keeping descriptor canonicalization implementation-specific.
  - source: src/avp_ref/runtime/engine.py
    observation: Runner output was recorded, but the verifier's post-validation accepted result representation was not preserved as its own immutable Oracle Evaluation Record.
    resolution: Publish a schema-valid Oracle Evaluation Record and require execution/output identity validation before accepting results.
  - source: src/avp_ref/oracle_runner/protocol.py
    observation: The reference worker uses a private single-frame JSON IPC protocol.
    resolution: Keep the framing implementation-specific; promote its observable integrity behavior, not the transport.
