apiVersion: avp.reconciliation/v0.1
kind: ReconciliationMatrix
metadata:
  domain: environment
  status: promoted-draft
  targetVersion: "0.1"
entries:
  - requirement: AVP-ENVIRONMENT-001
    decision: promote-language-neutral-semantics
    implementationEvidence:
      - src/avp_ref/environment/adapter.py
      - src/avp_ref/environment/models.py
      - conformance/tck/cases/environment/AVP-TCK-ENVIRONMENT-LIFECYCLE-001.yaml
    notes: Environment owns mutable resources; Python Protocol/handle dataclass shapes remain non-normative.
  - requirement: AVP-ENVIRONMENT-002
    decision: promote-language-neutral-semantics
    implementationEvidence:
      - src/avp_ref/environment/models.py
      - src/avp_ref/environment/in_memory.py
      - conformance/tck/cases/environment/AVP-TCK-ENVIRONMENT-LIFECYCLE-001.yaml
    notes: Provisioned handle binds ScenarioInstance digest; identifier format remains implementation-specific.
  - requirement: AVP-ENVIRONMENT-003
    decision: promote-with-conformance-required
    implementationEvidence:
      - src/avp_ref/environment/adapter.py
      - src/avp_ref/environment/in_memory.py
      - conformance/tck/cases/environment/AVP-TCK-ENVIRONMENT-RESET-TIME-001.yaml
    notes: Reset equivalence is established by portable TCK behavior rather than inferred from in-memory implementation details.
  - requirement: AVP-ENVIRONMENT-004
    decision: promote-abstract-semantics-only
    implementationEvidence:
      - src/avp_ref/environment/adapter.py
      - src/avp_ref/environment/in_memory.py
      - conformance/tck/cases/environment/AVP-TCK-ENVIRONMENT-RESET-TIME-001.yaml
    notes: Deterministic monotonic lineage semantics are normative; tick units and clock implementation are not.
  - requirement: AVP-ENVIRONMENT-005
    decision: promote-language-neutral-semantics
    implementationEvidence:
      - src/avp_ref/environment/adapter.py
      - src/avp_ref/environment/in_memory.py
      - spec/security/security-boundary-contract.md
      - conformance/tck/cases/environment/AVP-TCK-ENVIRONMENT-OBSERVATION-001.yaml
    notes: Actor-scoped observation composes with Security hidden-material and fault-secrecy requirements.
  - requirement: AVP-ENVIRONMENT-006
    decision: promote-language-neutral-semantics
    implementationEvidence:
      - src/avp_ref/environment/models.py
      - src/avp_ref/environment/in_memory.py
      - src/avp_ref/runtime/engine.py
      - conformance/tck/cases/environment/AVP-TCK-ENVIRONMENT-PROJECTION-001.yaml
    notes: Projection evidence identity is the projection identifier plus stable content digest; equal content across different projections is allowed and bare digest reuse is not sufficient projection identity.
  - requirement: AVP-ENVIRONMENT-007
    decision: promote-language-neutral-semantics
    implementationEvidence:
      - src/avp_ref/environment/models.py
      - src/avp_ref/environment/in_memory.py
      - conformance/tck/cases/environment/AVP-TCK-ENVIRONMENT-SNAPSHOT-RESTORE-001.yaml
    notes: Snapshot ownership and state identity are normative; foreign and tampered snapshot references fail closed while storage representation remains implementation-specific.
  - requirement: AVP-ENVIRONMENT-008
    decision: promote-honesty-semantics
    implementationEvidence:
      - src/avp_ref/environment/models.py
      - src/avp_ref/environment/in_memory.py
      - conformance/tck/cases/environment/AVP-TCK-ENVIRONMENT-SNAPSHOT-RESTORE-001.yaml
    notes: EXACT/STATE_EQUIVALENT/NON_EQUIVALENT semantic levels are promoted; the reference adapter truthfully reports STATE_EQUIVALENT rather than overstating exact restore.
  - requirement: AVP-ENVIRONMENT-009
    decision: promote-language-neutral-semantics
    implementationEvidence:
      - src/avp_ref/environment/models.py
      - src/avp_ref/environment/in_memory.py
      - conformance/tck/cases/environment/AVP-TCK-ENVIRONMENT-DIFF-001.yaml
    notes: Diff binds before/after/projection identities, rejects foreign snapshots, and leaves patch representation non-normative.
  - requirement: AVP-ENVIRONMENT-010
    decision: promote-with-security-composition
    implementationEvidence:
      - src/avp_ref/environment/models.py
      - src/avp_ref/environment/in_memory.py
      - spec/security/security-boundary-contract.md
      - conformance/tck/cases/environment/AVP-TCK-ENVIRONMENT-FAULT-001.yaml
    notes: Occurrence and clear semantics are portable; scheduler internals and adapter-specific parameters remain non-normative, and hidden future schedules remain governed by Security.
  - requirement: AVP-ENVIRONMENT-011
    decision: promote-fail-closed-semantics
    implementationEvidence:
      - src/avp_ref/environment/adapter.py
      - src/avp_ref/environment/in_memory.py
      - conformance/tck/cases/environment/AVP-TCK-ENVIRONMENT-LIFECYCLE-001.yaml
    notes: Released/stale handles fail closed; dead generation metadata was removed because the reference implementation does not reuse handle identifiers.
nonNormativeImplementationDetails:
  - Python Protocol/dataclass/enum shapes
  - handle and snapshot identifier formats
  - in-memory world representation
  - snapshot serialization/storage
  - state-diff algorithm
  - logical-time units
  - fault scheduler data structure
  - database/browser/container/VM adapter implementation
acceptanceAudit:
  status: passed
  evidence:
    - avp-environment-v0.1 has 7 mandatory portable TCK cases covering all 11 indexed requirements
    - reference implementation passes the full Environment profile
    - snapshot restore rejects foreign and tampered references
    - restore fidelity is STATE_EQUIVALENT and does not overclaim EXACT
    - projection evidence identity binds projection identifier and content digest without requiring unequal digests for equal content
    - diff rejects foreign snapshots and binds selected projection semantics
    - fault occurrence and clear behavior compose with Security fault secrecy
    - released and Scenario-mismatched handles fail closed
    - clean-wheel package smoke remains enabled
remainingGates:
  - final-head CI and Governance
  - unresolved review-thread check
  - main drift check
  - explicit user authorization before merge
