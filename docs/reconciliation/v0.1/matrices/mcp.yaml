apiVersion: avp.reconciliation/v0.1
kind: ReconciliationMatrix
metadata:
  domain: mcp
  status: reconciliation-draft
  targetVersion: "0.1"
entries:
  - requirement: AVP-MCP-001
    decision: bind-external-protocol-authority
    implementationEvidence:
      - src/avp_ref/mcp/models.py
      - src/avp_ref/mcp/transport.py
    notes: MCP 2026-07-28 is the external protocol authority; AVP does not redefine wire semantics or require server/discover.
  - requirement: AVP-MCP-002
    decision: promote-avp-capability-binding
    implementationEvidence:
      - src/avp_ref/mcp/gateway.py
      - spec/security/security-boundary-contract.md
      - spec/scenario/scenario-contract.md
    notes: Subject-visible MCP tools bind to compiled Scenario capabilities and fail closed before upstream invocation.
  - requirement: AVP-MCP-003
    decision: promote-verification-identity
    implementationEvidence:
      - src/avp_ref/mcp/models.py
      - src/avp_ref/mcp/gateway.py
    notes: Baseline tool-contract identity is AVP-owned; MCP cache TTL/scope/page shape remain retrieval metadata and are not contract identity.
  - requirement: AVP-MCP-004
    decision: promote-fail-closed-validation
    implementationEvidence:
      - src/avp_ref/mcp/gateway.py
      - tests/test_mcp_gateway.py
    notes: Input/output schema validation and claimed pre-call drift detection are verification requirements; JSON Schema semantics remain MCP-owned.
  - requirement: AVP-MCP-005
    decision: promote-verification-call-binding
    implementationEvidence:
      - src/avp_ref/mcp/models.py
      - src/avp_ref/runtime/engine.py
    notes: Correlation/tool/argument/schema/catalog/result/failure binding is normative; MCPCallRecord and runtime event names remain implementation-specific.
  - requirement: AVP-MCP-006
    decision: compose-with-mcp-wire-semantics
    implementationEvidence:
      - src/avp_ref/mcp/transport.py
      - src/avp_ref/mcp/gateway.py
      - tests/test_mcp_header_encoding.py
    notes: MCP owns Streamable HTTP metadata and mirrored-header encoding. Reference compliance gaps must be fixed before interoperability is claimed.
  - requirement: AVP-MCP-007
    decision: promote-failure-separation
    implementationEvidence:
      - src/avp_ref/mcp/gateway.py
      - src/avp_ref/mcp/models.py
    notes: Failed upstream attempts cannot become accepted successful result identities.
  - requirement: AVP-MCP-008
    decision: promote-feature-honesty
    implementationEvidence:
      - src/avp_ref/mcp/gateway.py
    notes: MRTR is not mandatory for AVP v0.1; unsupported input_required results fail closed instead of being flattened into success.
nonNormativeImplementationDetails:
  - Python MCPVerificationGateway class/API
  - urllib Streamable HTTP implementation
  - server/discover bootstrap choice
  - MCPToolCatalog/MCPCallRecord dataclass shapes
  - internal digest helper implementation
  - MCP SDK selection
  - cache implementation
  - authorization implementation
externalAuthority:
  protocol: Model Context Protocol
  revision: "2026-07-28"
  ownedSemantics:
    - JSON-RPC and message patterns
    - Streamable HTTP transport
    - request metadata and mirrored headers
    - tools/list and tools/call
    - tool JSON Schema semantics
    - cache metadata
    - authorization
    - MRTR
    - extensions
nextGates:
  - portable AVP MCP verification TCK vectors
  - requirement index bound only to registered TCK cases
  - reference MCP TCK adapter
  - full profile conformance
  - acceptance audit
