tck_cases:
  - AVP-TCK-SCENARIO-MATERIALIZATION-001
  - AVP-TCK-SCENARIO-UNRESOLVED-001
  - AVP-TCK-SCENARIO-IDENTITY-001
  - AVP-TCK-SCENARIO-IMMUTABILITY-001
  - AVP-TCK-SCENARIO-PROJECTION-001
