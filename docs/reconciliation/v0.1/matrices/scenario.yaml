decision_records:
  - docs/reconciliation/v0.1/decisions/scenario-instance-001.md
  - rfcs/AEP-0003-scenario-instance-contract.md

identity_contract:
  canonicalization: RFC8785-JCS
  digest: SHA-256
  excluded_top_level_fields: [instanceDigest, provenance]
  declared_identity_verification: required
  resolver_request_binding: fail-closed

compatibility:
  legacy_schema: schemas/scenario.schema.json
  policy: exact-mirror-of-scenario-template-schema

acceptance_evidence:
  - full avp-scenario-v0.1 reference TCK profile passes all six mandatory cases
  - ScenarioInstance construction validates schema, verifies declared identity, detaches caller input, and freezes execution semantics
  - strict reference resolution rejects symbolic identities and resolver path/URI substitution
  - repository and packaged ScenarioTemplate/ScenarioInstance schemas are kept in sync by CI
  - built-wheel reference and TCK smoke tests pass in an unconstrained clean environment
  - Security hidden-material and fault-secrecy behavior remains compatible with Scenario subject-projection semantics

open_reconciliation: []

note: >-
  The Scenario v0.1 reconciliation is technically complete for this Alpha slice.
  The matrix remains promoted-draft because pre-1.0 protocol promotion is governed
  by the repository release/AEP process rather than by reference implementation
  availability. The Python reference implementation advertises AVP-Scenario only
  after passing the complete avp-scenario-v0.1 profile; that implementation remains
  non-normative.
