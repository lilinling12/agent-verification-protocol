apiVersion: avp.reconciliation/v0.1
kind: ReconciliationMatrix
metadata:
  domain: opentelemetry
  status: reconciliation-draft
  targetVersion: "0.1"
entries:
  - requirement: AVP-OTEL-001
    decision: bind-episode-manifest-correlation
    implementationEvidence:
      - src/avp_ref/telemetry/bridge.py
      - src/avp_ref/runtime/manifest.py
    notes: Episode/manifest identity is AVP-owned; SpanContext representation remains OpenTelemetry-owned.
  - requirement: AVP-OTEL-002
    decision: promote-event-correlation
    implementationEvidence:
      - src/avp_ref/telemetry/bridge.py
      - src/avp_ref/events.py
    notes: AVP event identity and ordering must remain correlatable without requiring raw event payload capture.
  - requirement: AVP-OTEL-003
    decision: promote-tool-correlation
    implementationEvidence:
      - src/avp_ref/telemetry/bridge.py
      - src/avp_ref/runtime/engine.py
    notes: Tool call and terminal outcome correlation is normative; exact span naming and Python SDK objects are not.
  - requirement: AVP-OTEL-004
    decision: promote-outcome-preservation
    implementationEvidence:
      - src/avp_ref/telemetry/bridge.py
      - src/avp_ref/mcp/models.py
    notes: Telemetry must not flatten AVP failure/tool-error semantics into successful completion.
  - requirement: AVP-OTEL-005
    decision: compose-with-w3c-propagation
    implementationEvidence:
      - src/avp_ref/telemetry/bridge.py
      - tests/test_telemetry.py
    notes: W3C Trace Context is external authority; AVP only requires honest propagation when claimed.
  - requirement: AVP-OTEL-006
    decision: promote-data-minimization
    implementationEvidence:
      - src/avp_ref/telemetry/bridge.py
      - src/avp_ref/telemetry/models.py
      - spec/security/security-boundary-contract.md
    notes: Raw sensitive payloads and evaluator secrets are not required for mapping conformance and must remain protected.
  - requirement: AVP-OTEL-007
    decision: promote-completeness-honesty
    implementationEvidence:
      - src/avp_ref/telemetry/models.py
      - src/avp_ref/runtime/engine.py
    notes: COMPLETE/INCOMPLETE/REQUIRED_MISSING are AVP claim semantics and need stronger evidence than trace existence alone.
  - requirement: AVP-OTEL-008
    decision: compose-with-evidence
    implementationEvidence:
      - src/avp_ref/runtime/engine.py
      - spec/evidence/evidence-artifact-contract.md
    notes: Telemetry may become AVP Evidence, but it does not replace Oracle/state evidence or task verdict authority.
nonNormativeImplementationDetails:
  - Python OpenTelemetryBridge and TelemetrySession APIs
  - opentelemetry-sdk package choice/version
  - InMemorySpanExporter
  - exact Python span names
  - exact safe-attribute allowlist implementation
  - exporter/collector/backend deployment
  - sampling strategy
  - OTLP encoding
externalAuthority:
  protocol: OpenTelemetry
  semanticConventions: "1.43.0-current-at-reconciliation"
  ownedSemantics:
    - Span and SpanContext
    - status model
    - Context and propagators
    - W3C Trace Context integration
    - Resource/attribute/event model
    - SDK/exporter/processor behavior
    - semantic conventions
    - sampling
    - OTLP and collector behavior
nextGates:
  - portable AVP OpenTelemetry mapping TCK vectors
  - requirement index bound only to registered TCK cases
  - reference OpenTelemetry TCK adapter
  - completeness and outcome-preservation hardening
  - full profile conformance
  - acceptance audit
